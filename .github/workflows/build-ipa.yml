name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Configure built-in server
        env:
          PHOTO_BACKUP_SERVER_URL: ${{ vars.PHOTO_BACKUP_SERVER_URL }}
          PHOTO_BACKUP_DEVICE_KEY: ${{ secrets.PHOTO_BACKUP_DEVICE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PHOTO_BACKUP_SERVER_URL"
          test -n "$PHOTO_BACKUP_DEVICE_KEY"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("ios/PhotoBackup/Services/AppSettings.swift")
          text = path.read_text()
          text = text.replace("https://FRP_HOST:FRP_PORT", os.environ["PHOTO_BACKUP_SERVER_URL"])
          text = text.replace("DEVICE_ACCESS_KEY", os.environ["PHOTO_BACKUP_DEVICE_KEY"])
          path.write_text(text)
          PY

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build device app without signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project PhotoBackup.xcodeproj \
            -scheme PhotoBackup \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/PhotoBackup.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry PhotoBackup-unsigned.ipa Payload
          /usr/bin/shasum -a 256 PhotoBackup-unsigned.ipa > PhotoBackup-unsigned.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBackup-unsigned-ipa
          path: |
            ${{ runner.temp }}/PhotoBackup-unsigned.ipa
            ${{ runner.temp }}/PhotoBackup-unsigned.ipa.sha256
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: error
          retention-days: 30
